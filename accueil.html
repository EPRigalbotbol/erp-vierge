<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><script>/* à qui appartient cette installation : posé par nouveau_client.py, lu par _comptes.py et _serveur.py */window.COCKPIT_ORG="demo";</script><script>/* ============ LE GRENIER (17 oct. 2026) ============
   La mémoire « localStorage » d'un navigateur est limitée à 5 Mo par site. Le 17 octobre, celle de Sam était PLEINE
   (relevé des sites 1,1 Mo, factures 1 Mo, journal 0,75 Mo, devis 0,8 Mo…) : « This browser's storage is full », les
   dernières données n'étaient plus rangées, et la page travaillait sur une copie périmée. Les GROS magasins (24 Ko et
   plus) vont désormais au grenier : IndexedDB, qui offre des gigaoctets.
   Pour que RIEN ne change pour le code des pages — il lit et écrit localStorage, de façon synchrone — chaque gros
   magasin est gardé en mémoire vive dès l'ouverture de la page, et localStorage est doublé : getItem, setItem,
   removeItem, key et length répondent pour les deux endroits à la fois. Le grenier est chargé AVANT que la page ne
   démarre (voir l'AMORCE, qui attend window.__GRENIER). Entre deux onglets, un canal (BroadcastChannel) rejoue
   l'événement « storage » que le navigateur n'envoie plus pour ces magasins. Au premier passage, ce qui était gros
   dans localStorage déménage au grenier : la place se libère d'elle-même. */
(function(){
  const SEUIL=24*1024, MEM=new Map(); let DB=null, CANAL=null;
  const P=Storage.prototype, N={get:P.getItem,set:P.setItem,rem:P.removeItem,key:P.key,len:Object.getOwnPropertyDescriptor(P,'length').get};
  const local=s=>{ try{ return s===window.localStorage; }catch(e){ return false; } };
  /* 27 oct. 2026 : écriture « relaxed » (pas d'attente du disque) : avec plusieurs onglets ouverts qui rangent les mêmes gros
     magasins toutes les quelques secondes, les écritures s'empilaient et la lecture d'un nouvel onglet attendait derrière elles */
  const range=(k,v)=>{ if(!DB) return; try{ DB.transaction('m','readwrite',{durability:'relaxed'}).objectStore('m').put(v,k); }catch(e){ try{ DB.transaction('m','readwrite').objectStore('m').put(v,k); }catch(_){} } };
  const efface=(k)=>{ if(!DB) return; try{ DB.transaction('m','readwrite').objectStore('m').delete(k); }catch(e){} };
  const annonce=(k)=>{ try{ if(CANAL) CANAL.postMessage({k}); }catch(e){} };
  P.getItem=function(k){ if(local(this)){ const s=String(k); if(MEM.has(s)) return MEM.get(s); } return N.get.call(this,k); };
  P.setItem=function(k,v){ if(!local(this)) return N.set.call(this,k,v); const s=String(k), t=String(v);
    if(MEM.has(s)||t.length>=SEUIL){ if(MEM.get(s)===t) return; MEM.set(s,t); range(s,t); try{ if(N.get.call(this,s)!=null) N.rem.call(this,s); }catch(e){} annonce(s); return; }
    return N.set.call(this,k,v); };
  P.removeItem=function(k){ if(local(this)){ const s=String(k); if(MEM.has(s)){ MEM.delete(s); efface(s); annonce(s); } } return N.rem.call(this,k); };
  P.key=function(i){ if(local(this)){ const n=N.len.call(this); if(i>=n){ const ks=[...MEM.keys()]; return i-n<ks.length?ks[i-n]:null; } } return N.key.call(this,i); };
  Object.defineProperty(P,'length',{configurable:true,get(){ const n=N.len.call(this); return local(this)?n+MEM.size:n; }});
  const evt=(k)=>{ try{ window.dispatchEvent(new StorageEvent('storage',{key:k,storageArea:window.localStorage})); }catch(e){} };
  window.__GRENIER=new Promise(res=>{
    /* 27 oct. 2026 (Igal : « la rubrique Sales est vide ») : un onglet de l'ERP resté ouvert peut tenir le grenier sans le
       rendre ; la lecture attendait alors sans fin et la page restait blanche. Au bout de 2,5 s on démarre sans lui : ce qui
       manque est redemandé au serveur (verifCopies), et une lecture tardive du grenier n'écrase plus rien. */
    let FINI=false;
    const fini=(ok)=>{ if(FINI) return; FINI=true; res(ok);
      /* ce qui vient d'arriver du grenier : le menu (pastilles) a pu lire « rien » avant, on le prévient */
      try{ for(const k of MEM.keys()) evt(k); }catch(e){} };
    try{
      const q=indexedDB.open('sam-grenier',1);
      q.onupgradeneeded=()=>{ try{ q.result.createObjectStore('m'); }catch(e){} };
      q.onerror=()=>fini(false); q.onblocked=()=>fini(false);
      q.onsuccess=()=>{ DB=q.result;
        try{ CANAL=new BroadcastChannel('sam-grenier'); CANAL.onmessage=(m)=>{ const k=m&&m.data&&m.data.k; if(!k) return;
          try{ const r=DB.transaction('m','readonly').objectStore('m').get(k); r.onsuccess=()=>{ if(typeof r.result==='string') MEM.set(k,r.result); else MEM.delete(k); evt(k); }; }catch(e){} }; }catch(e){}
        let rk, rv;
        try{ const t=DB.transaction('m','readonly').objectStore('m'); rk=t.getAllKeys(); rv=t.getAll(); }catch(e){ fini(false); return; }
        rv.onerror=()=>fini(false);
        rv.onsuccess=()=>{ if(FINI) return; const ks=rk.result||[], vs=rv.result||[];
          ks.forEach((k,i)=>{ if(typeof vs[i]==='string') MEM.set(String(k),vs[i]); });
          /* déménagement : ce qui est gros dans localStorage part au grenier (une fois ; la place se libère) */
          try{ const L=window.localStorage, n=N.len.call(L), gros=[];
            for(let i=0;i<n;i++){ const k=N.key.call(L,i); const v=N.get.call(L,k); if(v!=null&&(MEM.has(k)||v.length>=SEUIL)) gros.push([k,v]); }
            gros.forEach(([k,v])=>{ if(!MEM.has(k)){ MEM.set(k,v); range(k,v); } N.rem.call(L,k); });
          }catch(e){}
          fini(true); };
      };
    }catch(e){ fini(false); }
    setTimeout(()=>{ if(!FINI){ window.__GRENIER_KO=true; try{ console.warn('grenier bloqué par un autre onglet : démarrage sans lui'); }catch(e){} fini(false); } },2500);
  });
})();</script>

/* un voile pour que le texte et la carte se lisent, plus dense au centre */
.voile{position:fixed;inset:0;z-index:1;
 background:
   radial-gradient(52% 54% at 50% 56%, rgba(18,10,24,.34) 0%, rgba(18,10,24,.20) 50%, rgba(18,10,24,0) 84%),
   linear-gradient(180deg, rgba(18,10,24,.52) 0%, rgba(18,10,24,.14) 22%, rgba(18,10,24,.10) 58%, rgba(18,10,24,.66) 100%)}

.ecran{position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column;
 align-items:center;justify-content:space-between;padding:30px 24px 24px;gap:18px}

.marque{display:flex;align-items:center;gap:15px}
.marque img{height:44px;width:auto;filter:brightness(0) invert(1);opacity:.95}
.marque .sep{width:1px;height:30px;background:rgba(255,255,255,.28)}
.marque .app{font-family:"Cormorant Garamond",Georgia,serif;font-size:21px;font-weight:400;
 letter-spacing:.14em;color:#fff;line-height:1}

/* ---------- la carte ---------- */
.centre{display:flex;flex-direction:column;align-items:center;gap:18px;width:100%}
.titre{text-align:center;max-width:22ch}
/* Le choix de la langue, dès la porte : la personne qui arrive ne lit pas forcément
   le français, et c'est ici qu'elle doit pouvoir le dire — pas après être entrée. */
.lg{position:absolute;top:14px;right:16px;display:flex;gap:4px;z-index:3}
.lg button{font:600 10.5px/1 Inter,sans-serif;letter-spacing:.06em;padding:6px 8px;border-radius:4px;cursor:pointer;
 border:1px solid rgba(255,255,255,.35);background:rgba(0,0,0,.25);color:#fff}
.lg button.on{background:#fff;color:#111;border-color:#fff}
.titre h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:300;
 font-size:clamp(30px,3.6vw,46px);line-height:1.1;letter-spacing:-.01em;margin:0 0 8px;color:#fff;
 text-shadow:0 2px 24px rgba(18,10,24,.6)}
.titre h1 em{font-style:italic;color:var(--bronze-clair)}
.titre p{margin:0;font-size:14px;line-height:1.6;color:rgba(255,255,255,.72);
 text-shadow:0 1px 14px rgba(18,10,24,.7)}

/* ---------- la carte : ivoire sur la photo, pour qu'elle se détache ---------- */
.carte{position:relative;width:100%;max-width:396px;background:var(--creme);
 border-radius:4px;padding:30px 32px 26px;
 box-shadow:0 30px 80px rgba(6,2,10,.55),0 2px 6px rgba(6,2,10,.30)}
/* un mince trait doré posé en haut, seule touche de couleur */
.carte::before{content:'';position:absolute;left:0;right:0;top:0;height:3px;
 border-radius:4px 4px 0 0;
 background:linear-gradient(90deg,var(--bronze) 0%,var(--bronze-clair) 50%,var(--bronze) 100%)}
.carte h2{font-family:"Cormorant Garamond",Georgia,serif;font-weight:400;font-size:30px;
 margin:0 0 6px;line-height:1.1;color:var(--ink)}
.carte .sous{margin:0 0 22px;font-size:13px;color:var(--ink-2);line-height:1.6;max-width:36ch}

label.f{display:block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;
 color:var(--ink-3);font-weight:700;margin:0 0 6px}
.champ{margin-bottom:16px}
input[type=text],input[type=password]{width:100%;padding:11px 13px;font-family:inherit;font-size:15px;
 border:1px solid var(--line);border-radius:6px;background:var(--blanc);color:var(--ink);
 transition:border-color .15s,box-shadow .15s}
input[type=text]::placeholder,input[type=password]::placeholder{color:#B6AEA2}
input[type=text]:focus,input[type=password]:focus{outline:0;border-color:var(--bronze);
 box-shadow:0 0 0 3px rgba(200,154,92,.20)}

.btn{width:100%;margin-top:4px;padding:13px 16px;border:0;border-radius:6px;
 background:var(--nuit);color:#fff;font-family:Inter,sans-serif;font-size:14px;font-weight:600;
 cursor:pointer;letter-spacing:.02em;transition:background .16s}
.btn:hover{background:#2C1A3A}
.btn.or{background:var(--bronze);color:#1B1020}
.btn.or:hover{background:#B4863F}
/* bouton secondaire : même taille, mais il ne tire pas l'oeil */
.btn.cl{margin-top:8px;background:transparent;color:var(--ink-2);
 border:1px solid var(--line);font-weight:500}
.btn.cl:hover{background:#F1ECE4;color:var(--ink)}

.msg{margin:12px 0 0;font-size:13px;line-height:1.5;min-height:18px}
.msg.err{color:var(--crit);font-weight:600}
.msg.ok{color:var(--good);font-weight:600}

.note{margin:18px 0 0;padding-top:14px;border-top:1px solid var(--line);
 font-size:11.5px;color:var(--ink-3);line-height:1.62}
.note b{color:var(--ink-2);font-weight:600}

/* ---------- les comptes d'essai : une ligne discrète, pas un tableau ---------- */
.demo{margin:16px 0 0;padding-top:13px;border-top:1px solid var(--line)}
.demo .lab{display:block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;
 color:var(--ink-3);font-weight:700;margin-bottom:8px}
.dbtn{display:flex;flex-wrap:wrap;gap:6px}
.dbtn button{border:1px solid var(--line);background:var(--blanc);border-radius:20px;
 padding:5px 12px;font-family:inherit;font-size:12.5px;color:var(--ink-2);cursor:pointer;
 transition:border-color .15s,color .15s}
.dbtn button:hover{border-color:var(--bronze);color:var(--ink)}
.dnote{margin:9px 0 0;font-size:11px;color:var(--ink-3);line-height:1.6}
.dnote b{color:var(--ink-2);font-weight:600}

  .titre h1{font-size:27px}
  .carte{padding:26px 22px 22px}
  .carte h2{font-size:30px}
    }

@media(max-height:740px){ .ecran{padding:20px 24px 18px} }

  [/^Annuler la facture (\S+) \((.*)\) \?$/,'Cancel invoice $1 ($2)?','¿Anular la factura $1 ($2)?'],
  [/^Supprimer (.+) \?$/,'Delete $1?','¿Eliminar $1?'],
  [/^Marge nette : prix de vente moins le prix d'achat et la commission (.+) \((\d+) %\)$/,'Net margin: selling price minus the purchase price and the $1 fee ($2%)','Margen neto: precio de venta menos el precio de compra y la comisión de $1 ($2 %)'],
  [/^Envoyer ses accès à (.+) \?$/,'Send their access to $1?','¿Enviar sus accesos a $1?'],
  [/^Impossible : (.+) (?:a|ont) ce rôle\. Change-leur d'abord le rôle, puis supprime celui-ci\.$/,'Not possible: $1 has this role. Change their role first, then delete this one.','Imposible: $1 tiene este rol. Cámbiales primero el rol y luego elimina este.']);

/* En français, le vocabulaire de la maison (« cote ») demande de parcourir la page

   où le mot n'apparaît pas et où le parcours coûterait cher à chaque redessin. */

     un par un — pour que l'écran ne montre jamais un texte dans la mauvaise langue

     suivant, comme avant : les phrases en bloc (lgBlocs), qui réécrivent un

  const tot=()=>{
    try{ lgBouton(); }catch(e){}
    try{ lgTitre(); }catch(e){}
    try{
      if(LANG!=='fr'){ document.documentElement.lang=LANG; lgApplique(document.body,true); }

      else if(LG_FR_PARCOURS) lgApplique(document.body);

     l'écran ne soit repeint, donc le mot n'est jamais vu dans la mauvaise langue.
     Avant, on attendait 120 ms puis on repassait sur toute la page : on voyait
     « Devis » clignoter en « Cote » à chaque redessin. En français sur le catalogue
     et le stock (des milliers de lignes), on ne visite que les zones qui imposent

  const veille=()=>{
    try{

        if(LANG==='fr' && !LG_FR_PARCOURS){ if(document.querySelector('[data-lang]')) document.querySelectorAll('[data-lang]').forEach(z=>lgApplique(z)); return; }

        .observe(document.body,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:['placeholder','title','aria-label']});

})();

   chez le client datée de demain, et l'entrée du journal se range au mauvais

function isoJour(d){
  const x = (d==null) ? new Date() : (d instanceof Date ? d : new Date(d));
  if(isNaN(x.getTime())) return '';
  return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')
         +'-'+String(x.getDate()).padStart(2,'0');
}
function ajd(){ return isoJour(); }
/* La boîte (x, y, largeur, hauteur) qui contient le flacon, ou null s'il n'y a rien à rogner. */
function _boiteFlacon(d,w,h){
  const px=(x,y)=>{ const i=(y*w+x)*4; return [d[i],d[i+1],d[i+2]]; };
  const C=[px(0,0),px(w-1,0),px(0,h-1),px(w-1,h-1)];
  const bg=[0,1,2].map(j=>Math.round(C.reduce((t,c)=>t+c[j],0)/4));
  if(C.some(c=>Math.max(Math.abs(c[0]-bg[0]),Math.abs(c[1]-bg[1]),Math.abs(c[2]-bg[2]))>40)) return null;
  const lig=new Array(h).fill(0), col=new Array(w).fill(0);
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    const i=(y*w+x)*4;
    if(Math.max(Math.abs(d[i]-bg[0]),Math.abs(d[i+1]-bg[1]),Math.abs(d[i+2]-bg[2]))>34){ lig[y]++; col[x]++; }
  }
  const premier=(T,n)=>{ for(let i=0;i<T.length;i++) if(T[i]>=n) return i; return -1; };
  const dernier=(T,n)=>{ for(let i=T.length-1;i>=0;i--) if(T[i]>=n) return i; return -1; };
  const x0=premier(col,2), x1=dernier(col,2), y0=premier(lig,2), y1=dernier(lig,2);
  if(x0<0||y0<0||x1<=x0||y1<=y0) return null;
  let bw=x1-x0+1, bh=y1-y0+1;
  if(bw*bh<0.03*w*h) return null;                       /* trois grains de poussière : on ne rogne pas sur eux */
  const m=Math.round(0.04*Math.max(bw,bh));
  const X=Math.max(0,x0-m), Y=Math.max(0,y0-m), X2=Math.min(w,x1+1+m), Y2=Math.min(h,y1+1+m);
  if((X2-X)>=0.97*w&&(Y2-Y)>=0.97*h) return null;       /* déjà plein cadre */
  return [X,Y,X2-X,Y2-Y];
}
/* UNE PHOTO CHOISIE À LA MAIN (Igal, 17 oct. 2026 : « changer la photo du produit ») : l'image est
   redessinée plus petite (640 px au plus, fond blanc, JPEG) avant d'être gardée — une photo de
   téléphone fait plusieurs Mo et la mémoire du navigateur n'en garde que quelques-uns.
   Rend une promesse : l'adresse « data: » de l'image, ou une erreur lisible. */
function photoReduite(fichier,max){
  max=max||640;
  return new Promise((ok,ko)=>{
    if(!fichier||!/^image\//.test(fichier.type||'')){ ko(new Error('pas une image')); return; }
    const r=new FileReader();
    r.onerror=()=>ko(new Error('lecture impossible'));
    r.onload=()=>{
      const im=new Image();
      im.onerror=()=>ko(new Error('image illisible'));
      im.onload=()=>{
        try{
          /* Igal, 17 oct. 2026 : « elle est petite à l'intérieur, j'aimerais qu'elle soit vraiment dans le cadre ».
             Une photo trouvée sur Internet a presque toujours de larges marges blanches : on les rogne (le flacon
             remplit le cadre, avec une petite marge) avant de réduire. Le fond est reconnu aux quatre coins ; si les
             coins ne sont pas du même ton (photo d'ambiance, dégradé), on ne rogne rien. */
          const W=im.width, H=im.height, k0=Math.min(1,800/Math.max(W,H));
          const aw=Math.max(1,Math.round(W*k0)), ah=Math.max(1,Math.round(H*k0));
          const a=document.createElement('canvas'); a.width=aw; a.height=ah;
          const ga=a.getContext('2d'); ga.fillStyle='#fff'; ga.fillRect(0,0,aw,ah); ga.drawImage(im,0,0,aw,ah);
          let sx=0, sy=0, sw=W, sh=H;
          const box=_boiteFlacon(ga.getImageData(0,0,aw,ah).data,aw,ah);
          if(box){ sx=box[0]/k0; sy=box[1]/k0; sw=box[2]/k0; sh=box[3]/k0; }
          const k=Math.min(max/Math.max(sw,sh),box?1.5:1);
          const w=Math.max(1,Math.round(sw*k)), h=Math.max(1,Math.round(sh*k));
          const c=document.createElement('canvas'); c.width=w; c.height=h;
          const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,w,h);
          g.drawImage(im,sx,sy,sw,sh,0,0,w,h);
          ok(c.toDataURL('image/jpeg',0.86));
        }catch(e){ ko(e); }
      };
      im.src=r.result;
    };
    r.readAsDataURL(fichier);
  });
}

function ficheFenetre(cle,apres,plus){
  if(!cle||document.getElementById('fv-ov')) return;
  if(!document.getElementById('fv-css')){
    const st=document.createElement('style'); st.id='fv-css';
    st.textContent='.fv-ov{position:fixed;inset:0;z-index:95;background:rgba(23,23,29,.45);backdrop-filter:blur(2px);display:flex;justify-content:flex-end}'
      +'.fv-ov iframe{border:0;width:min(940px,100%);height:100%;background:var(--surface,#fff);box-shadow:-8px 0 30px rgba(0,0,0,.18)}';
    document.head.appendChild(st);
  }
  const ov=document.createElement('div'); ov.id='fv-ov'; ov.className='fv-ov';
  const fr=document.createElement('iframe'); fr.title='Fiche du parfum'; fr.src='catalogue.html#cle='+encodeURIComponent(cle)+'&cadre=1'+(plus||'');   /* plus : « &mel=1 » ouvre « Mettre en ligne » (tableau de bord) */
  ov.appendChild(fr); document.body.appendChild(ov);
  const ferme=()=>{ window.removeEventListener('message',onMsg); ov.remove(); try{ if(apres) apres(); }catch(e){} };
  const onMsg=e=>{ if(e.origin===location.origin&&e.data&&e.data.fiche==='fermee') ferme(); };
  window.addEventListener('message',onMsg);
  ov.addEventListener('click',e=>{ if(e.target===ov) ferme(); });
}

/* L'HEURE, vue de la boutique : « 14:32 » à Miami, quel que soit l'ordinateur qui
   enregistre. Sert à horodater les ventes ; sans argument, c'est maintenant. */
function heureMiami(t){
  try{ const x=(t==null)?new Date():(t instanceof Date?t:new Date(t)); if(isNaN(x.getTime())) return '';
    return x.toLocaleTimeString('en-GB',{timeZone:'America/New_York',hour:'2-digit',minute:'2-digit',hour12:false}); }
  catch(e){ return ''; }
}

/* Le jour et l'heure à Miami d'un instant enregistré (« 2026-09-25T02:56:00Z »

function quandMiami(t){
  try{ const x=(t==null)?null:(t instanceof Date?t:new Date(t)); if(!x||isNaN(x.getTime())) return '';
    const j=x.toLocaleDateString('en-US',{timeZone:'America/New_York',day:'2-digit',month:'2-digit',year:'2-digit'});

/* Un magasin dont la FORME ne correspond plus à ce qu'on attend.
   `lit` rattrapait déjà le JSON illisible. Il ne rattrapait pas le JSON
   parfaitement lisible mais de la mauvaise forme : un objet là où le code
   attend une liste, une chaîne là où il attend un objet. La page recevait
   alors sa valeur sans broncher et mourait deux lignes plus loin sur un
   « FACT.slice is not a function » — écran figé, aucune explication.
   Ça n'a rien de théorique : un onglet fermé pendant une écriture, un quota
   atteint, une synchro coupée en deux suffisent. On compare donc la forme
   reçue à celle de la valeur par défaut, et on garde le défaut si elles ne
   se ressemblent pas : mieux vaut une page vide qu'une page morte. */
function _memeForme(v,d){
  if(d===null||d===undefined) return true;      // pas d'attente : on ne juge pas
  if(Array.isArray(d)) return Array.isArray(v);
  if(typeof d==='object') return v!==null && typeof v==='object' && !Array.isArray(v);
  return typeof v===typeof d;
}
/* lecture d'un magasin : on memorise au passage le point de comparaison */
let lit=(k,d)=>{
  let v=d;
  try{ const t=localStorage.getItem(k); if(t!=null) v=JSON.parse(t); }catch(e){ v=d; }
  if(!_memeForme(v,d)){
    try{ console.warn('donnée « '+k+' » de forme inattendue : on repart du défaut'); }catch(e){}
    v=d;
  }
  return base(k,v);
};

  }catch(e){} }

}

/* quelqu'un d'autre (autre onglet, autre personne) vient d'écrire : on le dit, sans rien écraser */
let _averti=false;
function avertitMaj(msg){
  if(_averti||!document.body) return;
  /* la fiche ouverte dans une fenêtre (mode cadre) et la page qui l'a ouverte écrivent dans les mêmes données :
     ce n'est pas « un autre onglet », et recharger la page effacerait la facture en cours de lecture */
  if(document.documentElement.classList.contains('cadre')||document.getElementById('fv-ov')) return;
  _averti=true;
  const b=document.createElement('div');
  b.style.cssText='position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:9999;'
   +'background:#1c1b22;color:#fff;padding:11px 16px;border-radius:10px;'
   +'font:500 13px Inter,system-ui,sans-serif;box-shadow:0 10px 34px rgba(0,0,0,.34);'
   +'display:flex;gap:13px;align-items:center;max-width:92vw';
  b.appendChild(document.createTextNode(msg||'Un autre onglet vient de modifier les données.'));
  const r=document.createElement('button'); r.textContent='Recharger cette page';
  r.style.cssText='background:#6b5cff;color:#fff;border:0;border-radius:7px;padding:7px 11px;font:600 12.5px Inter,system-ui,sans-serif;cursor:pointer;white-space:nowrap';
  r.onclick=()=>location.reload();

  x.style.cssText='background:none;border:0;color:#b9b7c4;font:500 12.5px Inter,system-ui,sans-serif;cursor:pointer';
  x.onclick=()=>{ b.remove(); _averti=false; };

}

/* ============ LE STOCK DE PERFUME CITY (13 oct. 2026) ============
   Perfume City est une boutique à part (celle de Kim). Son stock était gardé dans le navigateur
   d'UN seul ordinateur (inventaire-local-pc-v1) : Kim et Sam ne voyaient pas le même. Il vit
   maintenant dans un magasin PARTAGÉ, pc-stock-v1 : une fiche par code-barres, fusionnée champ
   par champ (deux postes qui touchent deux parfums différents ne s'écrasent pas).
   Les pages continuent de parler en « lignes » (les 12 colonnes d'avant) : pcsRows() / pcsSauve(). */
const K_PCS='pc-stock-v1', K_PCL='inventaire-local-pc-v1';
const pcsCle=r=>{ const bc=r&&r[0]?String(r[0]).replace(/^0+/,''):''; return bc||String((r&&r[9])||''); };
const pcsDe=r=>({bc:String(r[0]||''),nom:r[1]||'',m:r[2]||'',ml:String(r[3]||''),ty:r[4]||'',q:Math.round(+r[5]||0),
                 pa:r[6]==null||r[6]===''?null:+r[6],pvr:r[10]==null||r[10]===''?null:+r[10],pvw:r[11]==null||r[11]===''?null:+r[11],
                 cle:r[9]||(r[0]?'b'+r[0]:'')});
const pcsVers=o=>{ const q=+o.q||0, pa=o.pa==null?null:+o.pa;
  return [o.bc||'',o.nom||'',o.m||'',o.ml||'',o.ty||'',q,pa,pa!=null?q*pa:null,'non',o.cle||(o.bc?'b'+o.bc:''),
          o.pvr==null?null:o.pvr,o.pvw==null?null:o.pvw]; };
/* lit le magasin ; l'ancien stock gardé dans ce navigateur y entre une fois (sans écraser ce qui y est déjà) */
function pcsCarte(){
  let m=lit(K_PCS,{}); if(!m||typeof m!=='object'||Array.isArray(m)) m={};
  let vieux=null; try{ vieux=JSON.parse(localStorage.getItem(K_PCL)||'null'); }catch(e){}
  if(Array.isArray(vieux)&&vieux.length){
    let n=0; vieux.forEach(r=>{ const k=pcsCle(r); if(k&&!m[k]){ m[k]=pcsDe(r); n++; } });
    if(n) ecrit(K_PCS,m);
    try{ localStorage.removeItem(K_PCL); }catch(e){}
  }
  return m;
}
/* les lignes de l'inventaire Perfume City, rangées par marque puis nom ; null tant qu'il est vide */
function pcsRows(){
  const m=pcsCarte(), L=Object.keys(m).map(k=>pcsVers(m[k]));
  if(!L.length) return null;
  L.sort((a,b)=>String(a[2]).localeCompare(String(b[2]))||String(a[1]).localeCompare(String(b[1]))||String(a[3]).localeCompare(String(b[3])));
  return L;
}
/* écrit les lignes données : seules celles qui ont changé partent au serveur ; remplace=true vide d'abord */
function pcsSauve(rows,remplace){
  try{
    const m=remplace?(lit(K_PCS,{}),{}):pcsCarte(); let n=0;
    (rows||[]).forEach(r=>{ const k=pcsCle(r); if(!k) return; const o=pcsDe(r);
      if(JSON.stringify(m[k])!==JSON.stringify(o)){ m[k]=o; n++; } });
    if(n||remplace) ecrit(K_PCS,m);
    return true;
  }catch(e){ return false; }
}


/* ============ COMPTES, RÔLES ET SESSION ============ */
const K_USERS='sam-comptes-v1';
const K_SESS ='sam-session-v1';

const K_NOMS ='crm-utilisateurs-v1';

const _cLit=(k,d)=>{ try{ const t=localStorage.getItem(k); return t==null?d:JSON.parse(t); }catch(e){ return d; } };
const _cEcr=(k,v)=>{ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} };

/* Les droits, une bonne fois. La rubrique Accès s'en sert pour dessiner
   les cases à cocher : ajouter un droit ici suffit à le voir apparaître là-bas. */
const DROITS=[
  ['voirPA',    "Voit les prix d'achat"],
  ['voirMarge', 'Voit les marges'],
  ['modPrix',   'Modifie les prix'],
  ['vendre',    'Saisit des ventes et des remboursements'],
  ['compter',   "Compte le stock et l'ajuste"],
  ['reglages',  'Change les réglages'],
  ['acces',     'Ouvre et ferme les accès'],
  ['annuler',   'Annule une facture enregistrée (le stock et les prix reviennent en arrière)'],
  ['prixPC',    'Change le prix de Perfume City sur Shopify'],
  ['technique', 'Branche les services extérieurs et leurs clés']];

/* Les quatre rôles d'origine. On ne les touche pas : ils servent de repère,
   et un compte qui pointe dessus doit continuer de marcher quoi qu'il arrive.
   « voirPA » est le plus sensible : le prix d'achat révèle la marge, et tout
   le monde n'a pas à la connaître. */
const ROLES_BASE={
  /* Admin est au-dessus de Patron, et d'un seul cran : la plomberie technique.
     Brancher un service extérieur, c'est manipuler des clés d'API qui donnent
     accès au site, à la caisse et à l'argent qui y transite. Sam dirige son
     entreprise ; il n'a pas à toucher à ça, et la première erreur à cet
     endroit-là ne se voit pas — elle se découvre.
     Admin peut aussi modifier le compte du Patron : sans ça, un patron qui perd
     son mot de passe n'a plus personne pour le lui rendre. */
  admin:     {lib:'Admin',             aide:'Tout, plus le branchement des services extérieurs et leurs clés',
              voirPA:1, voirMarge:1, modPrix:1, vendre:1, compter:1, reglages:1, acces:1, annuler:1, prixPC:1, technique:1},
  patron:    {lib:'Patron',            aide:'Tout sur son entreprise — sauf le branchement des services extérieurs',
              voirPA:1, voirMarge:1, modPrix:1, vendre:1, compter:1, reglages:1, acces:1, annuler:1, prixPC:1, technique:0},
  commercial:{lib:'Commercial',        aide:'Vend et voit les prix de vente — pas les prix d\'achat',
              voirPA:0, voirMarge:0, modPrix:0, vendre:1, compter:0, reglages:0, acces:0, annuler:0, prixPC:0},
  entrepot:  {lib:'Entrepôt',          aide:'Compte le stock et ajuste — ne voit aucun prix',
              voirPA:0, voirMarge:0, modPrix:0, vendre:0, compter:1, reglages:0, acces:0, annuler:0, prixPC:0},
  comptable: {lib:'Comptable',         aide:'Lit tout, y compris les prix d\'achat — ne modifie rien',
              voirPA:1, voirMarge:1, modPrix:0, vendre:0, compter:0, reglages:0, acces:0, annuler:0, prixPC:0}};

/* ROLES = les quatre d'origine + ceux que le patron a fabriqués. Toutes les
   pages lisent ROLES[...] sans savoir d'où vient le rôle : c'est le but. */
const ROLES=Object.assign({}, ROLES_BASE);
function rolesPerso(){ const P=_cLit(K_ROLES,{}); return (P&&typeof P==='object'&&!Array.isArray(P))?P:{}; }
/* Le droit « technique » n'est JAMAIS ajustable : c'est lui qui fait que le rôle
   Admin veut dire quelque chose. Le donner d'un clic à n'importe quel rôle rendrait
   la hiérarchie décorative — et elle se serait défaite sans que personne ne le voie. */
const DROITS_FIGES=['technique'];
function _rolesMonte(){
  Object.keys(ROLES).forEach(k=>{ if(!ROLES_BASE[k]) delete ROLES[k]; else ROLES[k]=Object.assign({},ROLES_BASE[k]); });
  const P=rolesPerso();
  for(const k in P){
    if(ROLES_BASE[k]){
      /* un rôle d'origine ajusté : la base, puis l'ajustement, puis les droits
         figés remis de force. « ajuste » sert à l'écran, pour qu'il puisse dire
         que ce n'est plus le rôle d'origine. */
      ROLES[k]=Object.assign({}, ROLES_BASE[k], P[k], {ajuste:1});
      DROITS_FIGES.forEach(d=>{ ROLES[k][d]=ROLES_BASE[k][d]; });
    } else {
      ROLES[k]=Object.assign({perso:1}, P[k]);
    }
  }
}
function sauveRoles(P){ _cEcr(K_ROLES,P); _rolesMonte(); }
function roleDOrigine(k){ return !!ROLES_BASE[k]; }
_rolesMonte();

function comptes(){ const L=_cLit(K_USERS,[]); return Array.isArray(L)?L:[]; }
function sauveComptes(L){ _cEcr(K_USERS,L); }
/* Le rôle est RELU dans la liste des comptes à chaque appel, jamais pris tel quel
   dans la session. Sans cela, la session garde une photo du rôle prise au moment
   de la connexion : un rôle changé ou un accès fermé n'aurait d'effet qu'à la
   prochaine connexion — or personne ne se déconnecte jamais. Quelqu'un qu'on
   vient de rétrograder continuerait de voir les prix d'achat et les marges.
   On ne touche pas au cas « compte introuvable » : la liste peut être vide une
   fraction de seconde au premier chargement, et déconnecter tout le monde
   pendant ce laps de temps serait pire que le mal. */
let _sBrut='', _sListe=null;
function session(){
  const s=_cLit(K_SESS,null);
  if(!s||!s.id) return null;
  let brut=''; try{ brut=localStorage.getItem(K_USERS)||''; }catch(e){}
  if(brut!==_sBrut){ _sBrut=brut; _sListe=comptes(); }
  const u=(_sListe||[]).find(x=>x.ident===s.id);
  if(!u) return s;
  if(u.actif===false) return null;
  return (u.role===s.role && u.nom===s.nom) ? s : Object.assign({},s,{role:u.role,nom:u.nom});
}
function role(){ const s=session(); return (s&&ROLES[s.role])?ROLES[s.role]:null; }
function peut(d){ const r=role(); return r?!!r[d]:false; }
/* Sur les pages dont le code tourne en module (Étude de devis, Factures…), ces fonctions n'étaient pas
   visibles du menu, qui s'appliquait AVANT : un Commercial y voyait toute la partie Pilotage
   (Connecteurs, Accès, Réglages…). On les rend visibles, puis on réapplique le menu (19 oct. 2026). */
try{ window.session=session; window.role=role; window.peut=peut;

/* empreinte du mot de passe : on ne garde jamais le mot de passe en clair,
   même si ce n'est pas une protection contre quelqu'un de déterminé */
async function empreinte(mdp,sel){
  const t=new TextEncoder().encode('sam:'+sel+':'+mdp);
  const h=await crypto.subtle.digest('SHA-256',t);
  return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
const selNeuf=()=>[...crypto.getRandomValues(new Uint8Array(8))].map(b=>b.toString(16).padStart(2,'0')).join('');

async function creeCompte({nom,ident,mdp,role,par,email,provisoire}){
  const L=comptes();
  const id=String(ident||'').trim().toLowerCase();
  if(!id) throw new Error('Il faut un identifiant.');
  if(L.some(u=>u.ident===id)) throw new Error('Cet identifiant existe déjà.');
  const sel=selNeuf();
  L.push({ident:id, nom:String(nom||'').trim()||id, role:role||'commercial',
          sel, emp:await empreinte(mdp,sel), actif:true, email:String(email||'').trim(),
          /* un mot de passe pose par quelqu'un d'autre est provisoire : celui qui
             l'a choisi le connait. Le premier compte fait exception — c'est la
             personne elle-meme qui vient de le choisir. */
          doitChanger: provisoire===false ? false : true,
          cree:new Date().toISOString(), par:par||'', dernier:null});
  sauveComptes(L);
  return id;
}
async function verifie(ident,mdp){
  const id=String(ident||'').trim().toLowerCase();
  const u=comptes().find(x=>x.ident===id);
  if(!u) return null;
  if(!u.actif) return {bloque:true};
  const e=await empreinte(mdp,u.sel);
  return e===u.emp ? u : null;
}
function ouvreSession(u){
  _cEcr(K_SESS,{id:u.ident,nom:u.nom,role:u.role,depuis:new Date().toISOString()});
  try{ localStorage.setItem(K_NOM,u.nom); }catch(e){}
  const L=comptes(); const t=L.find(x=>x.ident===u.ident);
  if(t){ t.dernier=new Date().toISOString(); sauveComptes(L); }
  let N=_cLit(K_NOMS,[]); if(!Array.isArray(N)) N=[];
  if(!N.includes(u.nom)){ N.unshift(u.nom); _cEcr(K_NOMS,N.slice(0,12)); }
}
/* Quitter la session SANS quitter la page. « Ce n'est pas moi — changer de compte »,
   sur l'accueil, doit rendre le badge local ET le jeton du serveur : avant, seul le
   badge partait, et le navigateur gardait un jeton valide au nom de la personne
   précédente jusqu'à la connexion suivante — pour toujours si on refermait l'onglet
   là. Quelqu'un d'autre pouvait donc repartir avec les droits du patron. */
let quitteSession=function(){ try{ localStorage.removeItem(K_SESS); }catch(e){} };
function fermeSession(){
  quitteSession();
  location.href='accueil.html'+versUrl();
}

/* Où arrive chacun en entrant : sur ce qu'il a à faire, pas sur le catalogue.
   Le tableau de bord parle d'argent (marges, marchandise à perte) : on n'y envoie
   que ceux qui ont le droit de voir les marges. */
const ACCUEIL_ROLE={patron:'tableau.html', comptable:'tableau.html',
                    commercial:'ventes.html', entrepot:'stock.html'};
const DEPARTS=[['tableau.html','Tableau de bord'],['ventes.html','Ventes'],
               ['stock.html','Inventaire'],['catalogue.html','Catalogue'],
               ['factures.html','Factures'],['clients.html','Clients']];
/* Le ?v=… collé au bout : le navigateur garde longtemps en mémoire une page
   ouverte depuis un fichier local, et sert alors une version d'avant. Une
   adresse qui change à chaque livraison le force à relire. */
/* try : appelée avant la ligne qui pose VER_URL (session absente au chargement), le
   « typeof » ne protège pas d'une const pas encore posée — l'erreur bloquait le renvoi. */
const versUrl=()=>{ try{ return VER_URL ? ('?v='+VER_URL) : ''; }catch(e){ return ''; } };
/* pageDeDepart rend le NOM de la page — c'est une identité, comparable.
   urlDepart rend l'adresse où aller, avec le ?v=… qui force la relecture. */
function pageDeDepart(r){
  const d=(ROLES[r]||{}).depart;
  if(d && DEPARTS.some(x=>x[0]===d)) return d;
  return ACCUEIL_ROLE[r]||'catalogue.html';
}
function urlDepart(r){ return pageDeDepart(r)+versUrl(); }

/* Toute page de SAM commence par vérifier qu'une session est ouverte.
   Sinon on renvoie à l'accueil — sans effacer quoi que ce soit. */
function exigeSession(){
  if(session()) return true;
  if(!comptes().length) { location.href='accueil.html'+versUrl(); return false; }
  location.href='accueil.html'+versUrl();
  return false;
}

/* Remettre un mot de passe : en local on refait l'empreinte, en ligne on le dit au cockpit. */
/* Un TIERS repose le mot de passe de quelqu'un : il redevient provisoire, puisque
   celui qui l'a choisi le connait. */
async function remetMotDePasse(ident,mdp){
  const L=comptes(); const u=L.find(x=>x.ident===ident); if(!u) throw new Error('Compte inconnu.');
  u.sel=selNeuf(); u.emp=await empreinte(mdp,u.sel); u.doitChanger=true; sauveComptes(L);
}
/* La personne choisit ELLE-MEME le sien : l'ancien est exigé, et la marque tombe.
   Deux fonctions séparées, pas un drapeau : elles n'ont ni les mêmes droits, ni
   les mêmes vérifications, et les confondre finirait par laisser quelqu'un
   changer le mot de passe d'un autre sans le connaître. */
async function changeMonMotDePasse(ident,ancien,nouveau){
  const u=comptes().find(x=>x.ident===ident); if(!u) throw new Error('Compte inconnu.');
  if(await empreinte(ancien,u.sel)!==u.emp) throw new Error('Ancien mot de passe incorrect.');
  if(String(nouveau)===String(ancien)) throw new Error("Choisis un mot de passe différent de celui qu'on t'a donné.");
  const L=comptes(); const t=L.find(x=>x.ident===ident);
  t.sel=selNeuf(); t.emp=await empreinte(nouveau,t.sel); t.doitChanger=false; sauveComptes(L);
}

/* ============ EN LIGNE : LE COCKPIT DÉCIDE ============
   Sur le serveur, les comptes ne vivent plus dans le navigateur : c'est le cockpit
   (le socle d'Igal) qui les tient, les mêmes pour tout le monde, sur tous les
   appareils. Les fonctions ci-dessus gardent leur nom : les pages ne changent pas.
   En local (localhost, fichier), rien de tout ceci ne s'active. */
const CK_URL=(typeof COCKPIT_URL!=='undefined'&&COCKPIT_URL)||'https://cockpit.igalbotbol.com';
const CK_ORG=(typeof COCKPIT_ORG!=='undefined'&&COCKPIT_ORG)||'dasy';
const EN_LIGNE=location.protocol!=='file:' && !/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
const K_TOK='ck-token';
const ckTok=()=>{ try{ return localStorage.getItem(K_TOK)||''; }catch(e){ return ''; } };
function ckPerdu(){
  /* session refusée par le serveur : on efface le badge local et on retourne à l'entrée */
  try{ localStorage.removeItem(K_TOK); localStorage.removeItem(K_SESS); }catch(e){}
  if(!/accueil\.html$/.test(location.pathname)) location.replace('accueil.html'+versUrl());
}
async function ck(m,u,b){
  let r;
  try{
    r=await fetch(CK_URL+'/api/o/'+CK_ORG+u,{method:m,
      headers:Object.assign({'Content-Type':'application/json'}, ckTok()?{Authorization:'Bearer '+ckTok()}:{}),
      body:b==null?undefined:JSON.stringify(b)});
  }catch(e){ throw new Error('Le serveur ne répond pas. Vérifie la connexion et réessaie.'); }
  const j=await r.json().catch(()=>({}));
  if(r.status===401 && !/\/login$|\/premier$/.test(u)){ ckPerdu(); throw new Error(j.erreur||'Session expirée.'); }
  if(!r.ok){ const e=new Error(j.erreur||('Erreur '+r.status)); e.status=r.status; throw e; }
  return j;
}
function ckMiroirRoles(R){
  const P={}; for(const k in R||{}) if(!ROLES_BASE[k] || (R[k]&&R[k].ajuste)) P[k]=R[k];
  _cEcr(K_ROLES,P); _rolesMonte();
}
/* Rafraîchit les comptes et les rôles depuis le cockpit, puis prévient les pages. */
async function pretComptes(){
  if(!EN_LIGNE||!ckTok()) return false;
  const [L,R]=await Promise.all([ck('GET','/comptes'),ck('GET','/roles')]);
  _cEcr(K_USERS,L); ckMiroirRoles(R);
  try{ window.dispatchEvent(new Event('comptes-maj')); }catch(e){}
  return true;
}
if(EN_LIGNE){
  sauveComptes=function(L){
    /* les pages modifient la liste puis l'enregistrent : on envoie au cockpit ce qui a changé */
    const avant=comptes();
    for(const u of L){
      const a=avant.find(x=>x.ident===u.ident); if(!a) continue;
      const d={};
      if(!!a.actif!==!!u.actif) d.actif=u.actif?1:0;
      if(a.role!==u.role) d.role=u.role;
      if(a.nom!==u.nom) d.nom=u.nom;
      if((a.email||'')!==(u.email||'')) d.email=u.email||'';
      if(!!a.doitChanger!==!!u.doitChanger) d.doitChanger=!!u.doitChanger;
      if(Object.keys(d).length) ck('PATCH','/comptes/'+encodeURIComponent(u.ident),d).then(pretComptes).catch(e=>alert(e.message));
    }
    _cEcr(K_USERS,L);
  };
  creeCompte=async function({nom,ident,mdp,role,email,provisoire}){
    const id=String(ident||'').trim().toLowerCase();
    const mail=String(email||'').trim();
    if(!ckTok()) await ck('POST','/premier',{nom,ident:id,mdp,email:mail});   /* tout premier compte : le patron */
    else await ck('POST','/comptes',{nom,ident:id,mdp,role:role||'commercial',email:mail,
                                     provisoire: provisoire===false?false:true});
    try{ await pretComptes(); }catch(e){}

const _SY_T0=new Map(), _SY_LOURD=new Set();   /* début de l'envoi en cours ; envois trop gros pour survivre à un changement de page */
async function _syPut(cle,val,avant){

     connaissait pas en fasse disparaître la moitié (garde-fou du 20 oct. 2026, voir le cockpit) */
  const _n=v=>Array.isArray(v)?v.length:(v&&typeof v==='object')?Object.keys(v).length:0;

    headers:{'Content-Type':'application/json',Authorization:'Bearer '+ckTok(),'X-ERP-Proto':_SY_PROTO},
    body:corps});

  if(r.status===426){ _syPerimee(); throw new Error('page périmée'); }
  const j=await r.json().catch(()=>({}));

    /* quelqu'un a écrit entre-temps : on fusionne sa version avec ce que cet appareil a changé */
    /* 22 oct. 2026 : le repère de la fusion est celui de LA COPIE de cette page (ce qu'elle avait lu), pas la dernière
       version reçue du serveur — sinon une page restée ouverte retirait ce que les autres avaient ajouté entre-temps */
    const fus=fusionne(cle,j.val,(avant!==undefined&&avant!==null)?avant:_SY_BASE[cle],val);

async function _syPousse(cle){

    else if(err.message!=='session'){ _SY_HORS=true; if(!_SY_ATT.has(cle)) _SY_ATT.set(cle,e); }

}

/* Un cache de 2 s POUR L'AFFICHAGE (11 oct. 2026) : la colonne « Sur les sites » appelle ceci pour CHAQUE ligne
   du catalogue (3 800) ; relire et réanalyser les expéditions à chaque fois gelait la page. Les chemins qui

/* LECTURES GROUPÉES (13 oct. 2026). `_dq` relit ET réanalyse tout le magasin à chaque appel ; le tableau des quantités
   le faisait une fois PAR parfum (3 800 × plusieurs Mo) : la page restait figée ~15 s, 9 s après chaque ouverture
   (« page ne répond pas »). Pendant un calcul en masse on ouvre un « memo » : chaque magasin n'est lu qu'une fois. */
let _SS_MEMO=null;

function _ssEnMasse(f){ const avait=_SS_MEMO; if(!avait) _SS_MEMO={}; try{ return f(); } finally{ if(!avait) _SS_MEMO=null; } }

function _ssReserve(){
  const R=((_ssDq('site-reserve-v1',null)||{}).q)||{}, m={};
  for(const bc in R){ let reste=Math.round(+R[bc])||0; if(reste<=0) continue;

    for(const c of cles){ if(reste<=0) break; const r=_ssQte(c,{}); const dispo=r?r.q:0; const pris=Math.min(reste,dispo);

  const bc=String(m.bc||(f&&f.bc)||(/^b\d/.test(cle)?cle.slice(1):'')); if(!bc) return null;

    if((ventes||touche) && _syPageCalme() && typeof window.__rafraichir==='function'){

    if(typeof window.__rafraichir==='function'){ window.__SY_A_MONTRER=true; _syPlusTard(); return; }

let _SY_PT=null, _SY_PT_T0=0;
const SY_ATTENTE_MAX=30000;
/* 20 oct. 2026 (Igal : la vente PC-1562 était enregistrée, mais la page Ventes de Sam ne l'a montrée qu'au moment où Igal s'est
   connecté) : un curseur laissé dans un champ (« Chercher un client »…) rendait la page « pas calme » pour toujours — et depuis
   le 17 oct., sans bandeau, elle attendait en silence. Désormais, au bout de 30 s, si aucune fenêtre n'est ouverte, la page se
   redessine quand même, en remettant le curseur dans le champ, avec ce qui y était tapé. Une fenêtre ouverte (fiche, vente en
   cours) continue, elle, de bloquer : on ne redessine jamais sous une saisie en cours. */
function _syFenetreOuverte(){ try{ return !!document.querySelector('.ov.on,.dov.on,.mod.on,dialog[open],.mvoile'); }catch(e){ return true; } }
function _syRedessineEnGardantLeChamp(){
  const a=document.activeElement; const id=a&&a.id, val=a&&a.value, deb=a&&a.selectionStart, fin=a&&a.selectionEnd;
  try{ window.__rafraichir(); }catch(e){}
  if(!id) return;
  try{ const b=document.getElementById(id); if(!b) return;
    if(b!==a && 'value' in b && b.value!==val) b.value=val;
    b.focus({preventScroll:true}); if(deb!=null&&typeof b.setSelectionRange==='function'){ try{ b.setSelectionRange(deb,fin); }catch(_){} } }catch(e){}
}
function _syPlusTard(){
  if(_SY_PT) return;
  _SY_PT_T0=Date.now();
  _SY_PT=setInterval(()=>{ if(!window.__SY_A_MONTRER){ clearInterval(_SY_PT); _SY_PT=null; return; }
    if(document.hidden||typeof window.__rafraichir!=='function') return;
    const calme=_syPageCalme();
    if(!calme && (Date.now()-_SY_PT_T0<SY_ATTENTE_MAX || _syFenetreOuverte())) return;
    window.__SY_A_MONTRER=false; clearInterval(_SY_PT); _SY_PT=null;
    if(calme){ try{ window.__rafraichir(); }catch(e){} } else _syRedessineEnGardantLeChamp(); },2000);
}
function _syPageCalme(){
  try{
    if(document.querySelector('.ov.on,.dov.on,.mod.on,dialog[open],.mvoile')) return false;
    const a=document.activeElement; if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&a.type!=='checkbox'&&a.type!=='radio') return false;
    return true;
  }catch(e){ return false; }
}

   minute plus tard. La question posée au serveur est minuscule (des numéros de version). */

/* 20 oct. 2026 (Igal : entre le 19 à 18h35 et le 20 à 14h27, Sam ne voyait pas ses ventes — elles étaient bien sur le serveur) :
   une page qui ne reçoit plus rien ne doit JAMAIS rester silencieuse. Si le serveur n'a pas répondu à cette page depuis 2 minutes
   alors qu'elle est visible, une bande rouge le dit et propose de recharger. Elle disparaît d'elle-même quand le serveur répond. */
window.__SY_OK=Date.now();
function _syControlePerime(force){
  if(!_SY_ON&&!force) return;
  const age=Date.now()-(window.__SY_OK||0);
  let b=document.getElementById('sy-perime');
  if(document.hidden||age<120000){ if(b) b.remove(); return; }
  const lg=(typeof LANG==='string')?LANG:'fr', m=Math.max(2,Math.round(age/60000));
  const T=lg==='en'?['This page has not received anything from the server for '+m+' min: sales may be missing here. ','Reload']
    :lg==='es'?['Esta página no recibe nada del servidor desde hace '+m+' min: pueden faltar ventas aquí. ','Recargar']
    :['Cette page ne reçoit plus rien du serveur depuis '+m+' min : des ventes peuvent manquer ici. ','Recharger'];
  if(!b){ b=document.createElement('div'); b.id='sy-perime'; b.setAttribute('data-nolang','');
    b.style.cssText='position:fixed;z-index:2147483646;left:0;right:0;top:0;background:#9B2C2C;color:#fff;font:600 14px/1.4 system-ui,sans-serif;padding:10px 16px;text-align:center';
    document.body.appendChild(b); }
  b.innerHTML=''; b.appendChild(document.createTextNode(T[0]));
  const bt=document.createElement('button'); bt.textContent=T[1]; bt.style.cssText='margin-left:8px;padding:4px 12px;border:0;border-radius:6px;font-weight:700;cursor:pointer';
  bt.onclick=()=>location.reload(); b.appendChild(bt);
}

/* LE FIL EN DIRECT (1er oct. 2026, Igal : « il faut qu'à chaque fois que quelqu'un touche à
   l'ERP, les modifications soient instantanées ») : une connexion ouverte avec le cockpit, qui
   dit dans la seconde quels magasins ont changé. On va alors chercher ce qui a changé. Lu avec
   fetch (et non EventSource) pour envoyer la clé de session dans l'en-tête, pas dans l'adresse.
   Coupé (veille de l'ordinateur, réseau) : il se rebranche tout seul, et la relève toutes les
   8 s reprend en attendant. */
let _SY_TOUT_T=0;
function _syTout(){
  if(_SY_ENVOI.size||_SY_ATT.size){ clearTimeout(_SY_TOUT_T); _SY_TOUT_T=setTimeout(_syTout,400); return; }
  _syVeille(true);
}
async function _syFlux(){
  if(!_SY_ON||typeof fetch!=='function'||typeof TextDecoder!=='function') return;
  for(;;){
    try{
      const r=await fetch(CK_URL+'/api/o/'+CK_ORG+'/flux',{headers:{Authorization:'Bearer '+ckTok()},cache:'no-store'});
      if(r.status===401){ ckPerdu(); return; }
      if(r.status===404) return;                       /* cockpit d'avant : la relève suffit */
      if(!r.ok||!r.body||!r.body.getReader) throw new Error('flux');
      _SY_FLUX=true; _syTout();                        /* ce qui a pu changer pendant la coupure */
      const rd=r.body.getReader(), dec=new TextDecoder(); let buf='';
      for(;;){ const x=await rd.read(); if(x.done) break; buf+=dec.decode(x.value,{stream:true});
        let i; while((i=buf.indexOf('\n\n'))>=0){ const bloc=buf.slice(0,i); buf=buf.slice(i+2); if(/^data:/m.test(bloc)) _syTout(); } }
    }catch(e){}
    _SY_FLUX=false;
    await new Promise(ok=>setTimeout(ok,3000));
  }
}
window.__SY_FLUX=()=>_SY_FLUX;
if(_SY_ON) setTimeout(_syFlux,1500);

  /* de retour sur un onglet qui a reçu des nouveautés pendant qu'il était caché */
  if(window.__SY_A_MONTRER){ window.__SY_A_MONTRER=false;
    if(_syPageCalme() && typeof window.__rafraichir==='function'){ try{ window.__rafraichir(); }catch(e){} }
    else if(typeof window.__rafraichir==='function'){ window.__SY_A_MONTRER=true; _syPlusTard(); }

/* ---------- la sphère de Léa : elle respire au repos, vibre au son de sa voix, bat au micro, tourne quand elle réfléchit ----------
   GL_MODE : 'repos' | 'ecoute' (micro ouvert) | 'pense' (réponse en cours) | 'parle' (voix en cours).
   Le niveau sonore (0..1) vient d'un analyseur Web Audio : sur le mp3 de la voix clonée, et sur le micro quand Sam parle.
   Quand il n'y a pas d'analyseur (voix du navigateur, micro refusé), un battement synthétique fait vivre la sphère quand même. */
let GL_MODE='repos', GL_AC=null, GL_ANA=null, GL_MICFLUX=null, GL_ANIM=0;
function glMode(m){ GL_MODE=m; const st=document.getElementById('gl-etat'); if(st) st.textContent=m==='ecoute'?glT('je t\'écoute…','I\'m listening…','te escucho…'):m==='pense'?glT('je réfléchis…','thinking…','estoy pensando…'):m==='parle'?glT('je te parle','speaking','te hablo'):glT('prête','ready','lista'); }
function glAudioCtx(){ try{ if(!GL_AC){ const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; GL_AC=new C(); } if(GL_AC.state==='suspended') GL_AC.resume(); return GL_AC; }catch(e){ return null; } }
function glBranche(src){ const ac=glAudioCtx(); if(!ac) return null; const an=ac.createAnalyser(); an.fftSize=512; an.smoothingTimeConstant=.55; src.connect(an); GL_ANA=an; return an; }
function glNiveau(t){
  if(GL_ANA&&(GL_MODE==='parle'||GL_MODE==='ecoute')){ try{ const d=new Uint8Array(GL_ANA.fftSize); GL_ANA.getByteTimeDomainData(d); let s=0; for(let i=0;i<d.length;i++){ const v=(d[i]-128)/128; s+=v*v; } return Math.min(1,Math.sqrt(s/d.length)*4.5); }catch(e){} }
  if(GL_MODE==='parle') return .25+.35*Math.abs(Math.sin(t*7.3))*(.6+.4*Math.abs(Math.sin(t*1.9)));
  if(GL_MODE==='ecoute') return .12+.12*Math.abs(Math.sin(t*2.6));
  return 0;
}
function glOrbe(){
  const c=document.getElementById('gl-orb'); if(!c) return; const g=c.getContext('2d'); const W=c.width,H=c.height,cx=W/2,cy=H/2,R0=W*.25; let t=0, nivL=0;
  const av=document.getElementById('gl-av'); const photo=av&&av.style.display==='block';
  cancelAnimationFrame(GL_ANIM);
  function cadre(){
    if(!document.getElementById('gl-orb')){ GL_ANIM=0; return; }
    t+=1/60; const brut=glNiveau(t); nivL+=(brut-nivL)*(brut>nivL?.5:.12); const niv=nivL;
    const col=GL_MODE==='ecoute'?'31,211,192':GL_MODE==='parle'?'255,96,180':GL_MODE==='pense'?'255,186,84':'122,132,255';
    const resp=GL_MODE==='repos'?Math.sin(t*1.3)*2.5:0;
    g.clearRect(0,0,W,H);
    for(let k=3;k>=1;k--){
      const amp=(GL_MODE==='repos'?2.5:5)+niv*22*k/3;
      g.beginPath();
      for(let i=0;i<=96;i++){ const a=i/96*Math.PI*2; const w=Math.sin(a*(3+k)+t*(1.4+k*.8))*amp+Math.sin(a*(8-k)-t*2.6)*amp*.45;
        const r=R0*(1+k*.2)+w+niv*20*k/3+resp; const x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r; i?g.lineTo(x,y):g.moveTo(x,y); }
      g.closePath(); g.fillStyle='rgba('+col+','+(.07+(3-k)*.07+niv*.08)+')'; g.fill();
    }
    const r0=R0*(1+niv*.14)+resp;
    g.save(); g.shadowColor='rgba('+col+',.95)'; g.shadowBlur=26+niv*46;
    if(photo){ g.beginPath(); g.arc(cx,cy,r0*1.02,0,Math.PI*2); g.fillStyle='rgba('+col+',.55)'; g.fill(); }
    else { const gr=g.createRadialGradient(cx-R0*.32,cy-R0*.32,R0*.08,cx,cy,r0); gr.addColorStop(0,'rgba(255,255,255,.95)'); gr.addColorStop(.38,'rgba('+col+',.95)'); gr.addColorStop(1,'rgba('+col+',.3)');
      g.beginPath(); g.arc(cx,cy,r0,0,Math.PI*2); g.fillStyle=gr; g.fill(); }
    g.restore();
    if(GL_MODE==='pense'){ g.beginPath(); g.arc(cx,cy,R0*1.42,t*3.2,t*3.2+Math.PI*1.25); g.strokeStyle='rgba('+col+',.9)'; g.lineWidth=3; g.lineCap='round'; g.stroke();
      g.beginPath(); g.arc(cx,cy,R0*1.62,-t*2.1,-t*2.1+Math.PI*.6); g.strokeStyle='rgba('+col+',.45)'; g.lineWidth=2; g.stroke(); }
    if(photo&&av) av.style.transform='scale('+(1+niv*.12)+')';
    GL_ANIM=requestAnimationFrame(cadre);
  }
  GL_ANIM=requestAnimationFrame(cadre);
}
/* LA VOIX DE LÉA (clonée, produite par le cockpit). 3 nov. 2026, Igal : « elle met au moins 10 secondes avant de répondre »
   et « la voix était robotisée » (= la voix de secours du navigateur avait pris le relais sans le dire). Donc :
   - la réponse est découpée en morceaux (une ou deux phrases) : le premier morceau part chez ElevenLabs tout de suite, le
     suivant est demandé pendant que le premier se joue → Léa commence à parler en une à deux secondes, pas après tout ;
   - dès que la question part, Léa dit un mot d'accueil (« Je regarde. »), fabriqué une fois et gardé sur ce poste ;
   - si ElevenLabs rate, on réessaie une fois ; si ça rate encore, la voix du navigateur prend le relais MAIS la raison
     s'affiche sous la sphère et reste dans localStorage (galou-voix-raison) pour qu'Igal sache pourquoi. */
let GL_AUDIO=null, GL_VOIX_IGAL=null;   /* GL_VOIX_IGAL : null = on ne sait pas encore, true/false = réponse du cockpit (etat.voix) */
let GL_FILE=[], GL_LECTURE=false, GL_SERIE=0, GL_FIN=null;   /* la file des morceaux à dire, dans l'ordre ; GL_FIN : à appeler quand tout est dit */
function glMorceaux(texte){
  const ph=String(texte||'').replace(/\s+/g,' ').trim().match(/[^.!?…]+[.!?…]+["»”)]?\s*|[^.!?…]+$/g)||[texte];
  const M=[]; let cur='';
  ph.forEach(x=>{ x=x.trim(); if(!x) return; if(cur&&(cur.length+x.length>220||cur.length>120)){ M.push(cur); cur=x; } else cur=cur?cur+' '+x:x; });
  if(cur) M.push(cur); return M;
}
async function glMp3(texte){
  const r=await fetch(CK_URL+'/api/o/'+CK_ORG+'/galou/voix',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+ckTok()},body:JSON.stringify({texte})});
  if(!r.ok){ let m='voix '+r.status; try{ const j=await r.json(); if(j&&j.erreur) m=j.erreur; }catch(e){} throw new Error(m); }
  return r.blob();
}
function glRaison(m){ const st=document.getElementById('gl-etat'); if(st){ st.textContent=glT('voix de Léa indisponible : ','Léa\'s voice unavailable: ','voz de Léa no disponible: ')+m; st.classList.add('err'); setTimeout(()=>{ st.classList.remove('err'); glMode(GL_MODE); },9000); } try{ localStorage.setItem('galou-voix-raison',new Date().toISOString()+' '+m); }catch(e){} }
function glJoue(blob){ return new Promise((ok)=>{ const u=URL.createObjectURL(blob); const a=new Audio(u); GL_AUDIO=a;
  /* la sphère suit le vrai niveau sonore de la voix : l'audio passe par un analyseur Web Audio avant les haut-parleurs */
  try{ const ac=glAudioCtx(); if(ac){ const src=ac.createMediaElementSource(a); const an=glBranche(src); if(an) an.connect(ac.destination); } }catch(e){}
  a.onplay=()=>glMode('parle'); let fait=false; const fin=()=>{ if(fait) return; fait=true; URL.revokeObjectURL(u); if(GL_AUDIO===a) GL_AUDIO=null; ok(true); }; a.onended=fin; a.onerror=fin; a._fin=fin;
  a.play().catch(e=>{ glRaison(String(e&&e.message||e).slice(0,80)); fin(); }); }); }
async function glLecture(serie){
  /* une lecture par série : quand une nouvelle réponse (ou le micro) coupe, la série change et cette boucle s'arrête d'elle-même */
  GL_LECTURE=true;
  while(GL_FILE.length&&serie===GL_SERIE){ const m=GL_FILE.shift(); let b=null;
    if(!m.p&&m.d) m.p=m.d(m.t);   /* pas encore demandé (la lecture va plus vite que la file) : on le demande maintenant */
    try{ b=await m.p; }catch(e){ b=null; }
    if(serie!==GL_SERIE) return;
    if(b) await glJoue(b); else { await new Promise(ok=>glDitNavigateur(m.t,ok)); }
  }
  if(serie===GL_SERIE){ GL_LECTURE=false; glMode('repos'); const f=GL_FIN; GL_FIN=null; if(f) f(); }
}
function glDit(texte,apres){
  glCoupe(); GL_FIN=apres||null; if(!GL_VOIX){ glMode('repos'); const f=GL_FIN; GL_FIN=null; if(f) f(); return; }
  const serie=GL_SERIE;
  if(GL_VOIX_IGAL&&glPeut()){
    const M=glMorceaux(texte);
    /* deux morceaux demandés d'avance au plus : le premier part maintenant, le deuxième pendant que le premier se joue */
    const demande=(t)=>glMp3(t).catch(()=>glMp3(t)).catch(e=>{ glRaison(String(e&&e.message||e).slice(0,90)); return null; });
    M.forEach((t,i)=>{ const o={t,p:null,d:demande}; o.p=i<2?demande(t):null; GL_FILE.push(o); });
    /* les suivants sont demandés au fur et à mesure (toujours un d'avance) */
    const suivant=()=>{ const o=GL_FILE.find(x=>!x.p); if(o){ o.p=demande(o.t); o.p.finally(()=>{ if(serie===GL_SERIE) suivant(); }); } };
    setTimeout(suivant,300);
    glLecture(serie); return;
  }
  GL_FILE.push({t:texte,p:Promise.resolve(null)}); glLecture(serie);
}
/* tout arrêter : la voix en cours, les morceaux en attente */
function glCoupe(){ GL_SERIE++; GL_FILE=[]; GL_FIN=null; GL_LECTURE=false; try{ speechSynthesis&&speechSynthesis.cancel(); }catch(e){} try{ if(GL_AUDIO){ const a=GL_AUDIO; GL_AUDIO=null; a.pause(); if(a._fin) a._fin(); } }catch(e){} }
/* le mot d'accueil, dit tout de suite quand la question part (fabriqué une fois par langue, gardé sur ce poste) */
async function glAccuse(){
  if(!GL_VOIX||!GL_VOIX_IGAL||!glPeut()) return;
  const lg=glLang().slice(0,2), txt=lg==='en'?'Let me check.':lg==='es'?'Déjame ver.':'Je regarde.'; const k='galou-accuse-v1:'+lg;
  try{ let b64=null; try{ b64=localStorage.getItem(k); }catch(e){}
    let blob; if(b64){ const bin=atob(b64); const u8=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i); blob=new Blob([u8],{type:'audio/mpeg'}); }
    else { blob=await glMp3(txt); const buf=new Uint8Array(await blob.arrayBuffer()); let str=''; for(let i=0;i<buf.length;i++) str+=String.fromCharCode(buf[i]); try{ localStorage.setItem(k,btoa(str)); }catch(e){} }
    if(GL_MODE==='pense'&&!GL_AUDIO&&!GL_LECTURE){ await glJoue(blob); if(GL_ENV) glMode('pense'); }
  }catch(e){}
}
/* à l'oral, les marques écrites à l'ancienne se prononcent normalement (le cockpit fait pareil pour la voix de Léa) */
const GL_PRONONCE=[[/\bBvlgari\b/gi,'Bulgari'],[/\bAqva\b/gi,'Aqua']];
function glPrononcable(t){ t=String(t||''); GL_PRONONCE.forEach(([re,par])=>{ t=t.replace(re,par); }); return t; }
function glDitNavigateur(texte,apres){
  if(!('speechSynthesis' in window)){ if(apres) apres(); return; }
  try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(glPrononcable(texte)); u.lang=glLang(); u.rate=1.02;
    /* à défaut de la voix clonée : une voix de femme du navigateur, dans la langue de la page */
    const V=speechSynthesis.getVoices().filter(v=>v.lang&&v.lang.toLowerCase().startsWith(glLang().slice(0,2)));
    const pref=V.find(v=>/amelie|audrey|marie|aurelie|monica|paulina|samantha|victoria|female|femme/i.test(v.name))||V.find(v=>!/thomas|nicolas|daniel|paul|jorge|diego|male|homme/i.test(v.name))||V[0];
    if(pref) u.voice=pref; GL_ANA=null; u.onstart=()=>glMode('parle'); u.onend=u.onerror=()=>{ if(apres) apres(); }; speechSynthesis.speak(u); }catch(e){ if(apres) apres(); }
}
let GL_PAR_MICRO=false;   /* la dernière question est venue du micro : après la réponse, Léa réécoute toute seule */
async function glEnvoie(texte,parMicro){
  texte=String(texte||'').trim(); if(!texte||GL_ENV) return;
  GL_PAR_MICRO=!!parMicro; glCoupe();
  GL_CONV.push({role:'user',content:texte}); glSauve(); glAjoute('user',texte);
  GL_ENV=true; glMode('pense'); glAccuse(); const att=glAjoute('assistant',glT('Léa réfléchit…','Léa is thinking…','Léa está pensando…'),'att');
  try{
    const r=await fetch(CK_URL+'/api/o/'+CK_ORG+'/galou/parle',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+ckTok()},body:JSON.stringify({messages:GL_CONV.slice(-12),page:(document.querySelector('.main h1')||{}).textContent||''})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(j.erreur||('serveur '+r.status));
    /* au cas où le modèle met quand même du gras ou des puces : on les enlève, la réponse est lue à voix haute */
    const rep=String(j.texte||'').replace(/\*\*|__|^#+\s*/gm,'').replace(/^\s*[-•]\s+/gm,'').trim()||glT('(pas de réponse)','(no answer)','(sin respuesta)');
    GL_CONV.push({role:'assistant',content:rep}); glSauve();
    if(att){ att.textContent=rep; att.classList.remove('att'); }
    /* conversation continue : si Sam a parlé au micro, Léa réécoute dès qu'elle a fini (il n'a rien à appuyer) */
    GL_ENV=false; glDit(rep, ()=>{ if(GL_PAR_MICRO&&GL_SUITE&&document.getElementById('gl-ov')&&!GL_REC) glMicro(true); });
  }catch(e){
    const m=glT('Léa ne répond pas : ','Léa is not answering: ','Léa no responde: ')+(e&&e.message||e);
    if(att){ att.textContent=m; att.classList.remove('att'); }
    glCoupe(); glMode('repos'); GL_CONV.pop(); glSauve();
  }
  GL_ENV=false; const b=document.getElementById('gl-b'); if(b) b.scrollTop=b.scrollHeight;
}
/* le micro : la reconnaissance vocale du navigateur (Chrome) ; la phrase part toute seule quand elle est finie */
let GL_SUITE=true; try{ GL_SUITE=localStorage.getItem('galou-suite-v1')!=='0'; }catch(e){}
function glMicro(auto){
  const bt=document.getElementById('gl-mic'); const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ alert(glT('Ce navigateur n\'a pas de micro pour Léa : utilise Chrome.','This browser has no microphone for Léa: use Chrome.','Este navegador no tiene micrófono para Léa: usa Chrome.')); return; }
  if(GL_REC){ try{ GL_REC.stop(); }catch(e){} GL_REC=null; if(bt) bt.classList.remove('on'); glMicroFerme(); return; }
  if(GL_ENV) return;
  const r=new SR(); r.lang=glLang(); r.interimResults=true; r.continuous=false; const ec=document.getElementById('gl-ecoute'); let fin='', entendu='';
  r.onresult=ev=>{ let t=''; for(let i=ev.resultIndex;i<ev.results.length;i++){ t+=ev.results[i][0].transcript; if(ev.results[i].isFinal) fin=t; } entendu=t; if(ec) ec.textContent=t; };
  r.onend=()=>{ GL_REC=null; if(bt) bt.classList.remove('on'); glMicroFerme(); if(ec) ec.textContent=''; const t=(fin||entendu||'').trim(); if(t) glEnvoie(t,true); };
  r.onerror=()=>{ GL_REC=null; if(bt) bt.classList.remove('on'); glMicroFerme(); if(ec) ec.textContent=''; };
  glCoupe();
  GL_REC=r; if(bt) bt.classList.add('on'); glMode('ecoute'); try{ r.start(); }catch(e){ GL_REC=null; if(bt) bt.classList.remove('on'); glMicroFerme(); return; }
  /* le micro aussi passe par un analyseur : la sphère bat au rythme de la voix de Sam (si le micro est refusé, battement synthétique) */
  try{ if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){ navigator.mediaDevices.getUserMedia({audio:true}).then(f=>{ if(!GL_REC){ f.getTracks().forEach(x=>x.stop()); return; } GL_MICFLUX=f; const ac=glAudioCtx(); if(ac) glBranche(ac.createMediaStreamSource(f)); }).catch(()=>{}); } }catch(e){}
}
function glMicroFerme(){ try{ if(GL_MICFLUX){ GL_MICFLUX.getTracks().forEach(x=>x.stop()); GL_MICFLUX=null; } }catch(e){} GL_ANA=null; if(GL_MODE==='ecoute') glMode('repos'); }

      const sv=document.getElementById('gl-sousvoix'); if(sv) sv.textContent=GL_VOIX_IGAL?glT('(la voix de Léa)','(Léa\'s voice)','(la voz de Léa)'):'';

      glAccuse(); /* le mot d'accueil est fabriqué d'avance, pour être prêt à la première question */ }).catch(()=>{}); }
  else if(GL_VOIX_IGAL){ const sv=document.getElementById('gl-sousvoix'); if(sv) sv.textContent=glT('(la voix de Léa)','(Léa\'s voice)','(la voz de Léa)'); }

/* Les trois boutons de langue de la porte. On ne passe pas par lgChange : il

const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- premier démarrage : on crée le compte admin ----------
   Le tout premier compte est celui de la personne qui installe l'outil et qui
   branchera les services extérieurs : c'est un Admin, pas un Patron. Le compte
   du patron de l'entreprise se crée ensuite, depuis Accès. Sur une installation
   déjà en service, rien ne change : les comptes existants gardent leur rôle. */
function ecranPremier(){
  $('carte').innerHTML=`
    <h2>Premier démarrage</h2>
    <p class="sous">Aucun compte n'existe encore. Crée celui du patron : c'est le seul
    qui pourra ensuite ouvrir des accès aux autres.</p>
    <div class="champ"><label class="f" for="n">Nom de la personne</label>
      <input type="text" id="n" autocomplete="off" placeholder="Sam"></div>
    <div class="champ"><label class="f" for="i">Identifiant</label>
      <input type="text" id="i" autocomplete="off" placeholder="sam"></div>
    <div class="champ"><label class="f" for="m">Mot de passe</label>
      <input type="password" id="m" autocomplete="new-password" placeholder="au moins 8 caractères"></div>
    <div class="champ"><label class="f" for="m2">Répète le mot de passe</label>
      <input type="password" id="m2" autocomplete="new-password"></div>
    <button class="btn or" id="go">Créer le compte et entrer</button>
    <p class="msg" id="msg"></p>
    ${EN_LIGNE
      ? `<p class="note"><b>Ce compte vit sur le serveur.</b> Il vaut sur tous les appareils, et seul
         le patron pourra ensuite ouvrir, fermer ou changer les accès des autres.</p>`
      : `<p class="note"><b>À savoir.</b> Tant que l'outil tourne sur cet ordinateur et pas sur un serveur,
    ce mot de passe est un <b>badge, pas une serrure</b> : il dit qui travaille et ce que chacun voit.
    La vraie serrure viendra avec le serveur.</p>`}`;
  const val=async()=>{
    const n=$('n').value.trim(), i=$('i').value.trim(), m=$('m').value, m2=$('m2').value;
    const dis=t=>{ $('msg').textContent=t; $('msg').className='msg err'; };
    if(n.length<2) return dis('Mets le nom de la personne.');
    if(!/^[a-zA-Z0-9._-]{2,}$/.test(i)) return dis('Identifiant : lettres, chiffres, point ou tiret, sans espace.');
    if(m.length<8) return dis('Le mot de passe doit faire au moins 8 caractères.');
    if(m!==m2) return dis('Les deux mots de passe ne sont pas identiques.');
    try{
      /* provisoire:false — cette personne vient de choisir son mot de passe
         elle-même, sur cet écran. Lui redemander d'en changer serait absurde. */
      await creeCompte({nom:n,ident:i,mdp:m,role:'admin',par:'premier démarrage',provisoire:false});
      const u=await verifie(i,m); ouvreSession(u);
      journalConnexion(u,'compte patron créé');
      $('msg').textContent='Compte créé. On entre…'; $('msg').className='msg ok';
      setTimeout(()=>location.href=urlDepart(u.role),600);
    }catch(e){ dis(e.message||'Impossible de créer le compte.'); }
  };
  $('go').onclick=val;
  ['n','i','m','m2'].forEach(k=>$(k).addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); val(); } }));
  setTimeout(()=>$('n').focus(),80);
}

/* ---------- connexion ---------- */
function ecranConnexion(){
  const L=comptes().filter(u=>u.actif);
  const der=L.slice().sort((a,b)=>String(b.dernier||'').localeCompare(String(a.dernier||'')))[0];
  $('carte').innerHTML=`
    <h2>Bonjour</h2>
    <p class="sous">Identifie-toi : chaque prix modifié et chaque flacon qui sort du stock
    sera écrit au journal à ton nom.</p>
    <div class="champ"><label class="f" for="i">Identifiant</label>
      <input type="text" id="i" autocomplete="username"></div>
    <div class="champ"><label class="f" for="m">Mot de passe</label>
      <input type="password" id="m" autocomplete="current-password"></div>
    <button class="btn" id="go">Entrer</button>
    <p class="msg" id="msg"></p>
    ${blocDemo()}
    <p class="note">Mot de passe oublié ? Seul le patron peut en remettre un, depuis <b>Accès</b>.
    Personne ne peut le relire : SAM n'en garde qu'une empreinte.</p>`;
  if(der&&!estDemo()) $('i').value=der.ident;
  const val=async()=>{
    const i=$('i').value.trim(), m=$('m').value;
    if(!i||!m){ $('msg').textContent='Identifiant et mot de passe.'; $('msg').className='msg err'; return; }
    /* Trois issues, et il faut les distinguer : mauvais mot de passe, compte fermé,
       et « le socle ne répond pas ». Sans ce try, une panne du cockpit faisait un
       bouton mort : aucun message, rien à l'écran, et personne ne peut entrer un
       matin d'ouverture sans comprendre pourquoi. */
    let u;
    try{ u=await verifie(i,m); }
    catch(e){
      $('msg').innerHTML='<b>Le socle ne répond pas.</b> Ton identifiant et ton mot de passe '
        +"n'ont pas pu être vérifiés — ce n'est pas toi, c'est la liaison avec le serveur. "
        +'Réessaie dans un instant ; si ça dure, préviens Igal.';
      $('msg').className='msg err';
      return;
    }
    if(u&&u.bloque){ $('msg').textContent='Ce compte est désactivé. Vois avec le patron.';
      $('msg').className='msg err'; return; }
    if(!u){ $('msg').textContent='Identifiant ou mot de passe incorrect.';
      $('msg').className='msg err'; $('m').value=''; $('m').focus(); return; }
    /* Mot de passe provisoire : on n'ouvre PAS la session tant qu'il n'en a pas
       choisi un autre. Ouvrir d'abord et demander ensuite laisserait entrer avec
       un mot de passe qu'un tiers connaît — et que la personne pourrait ignorer
       en fermant l'onglet. */
    if(u.doitChanger) return ecranNouveauMdp(u,m);
    ouvreSession(u); journalConnexion(u,'connexion');
    $('msg').textContent='Bienvenue '+u.nom+'.'; $('msg').className='msg ok';
    setTimeout(()=>location.href=urlDepart(u.role),420);
  };
  $('go').onclick=val;
  ['i','m'].forEach(k=>$(k).addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); val(); } }));
  setTimeout(()=>$((der&&!estDemo())?'m':'i').focus(),80);
}

/* ---------- premier passage : choisir son propre mot de passe ----------
   Celui qu'on a reçu a été choisi par quelqu'un d'autre, et il a pu passer par un
   email — où il restera des années. Tant qu'il n'est pas remplacé, il n'ouvre
   rien : la session ne s'ouvre qu'après. */
function ecranNouveauMdp(u,ancien){
  $('carte').innerHTML=`
    <h2>Bienvenue ${esc(u.nom)}</h2>
    <p class="sous">Le mot de passe qu'on t'a donné est provisoire : quelqu'un d'autre
    l'a choisi, et il a pu passer par un email. Choisis le tien, il ne sera connu
    que de toi — pas même du patron.</p>
    <div class="champ"><label class="f" for="n1">Ton nouveau mot de passe</label>
      <input type="password" id="n1" autocomplete="new-password"></div>
    <div class="champ"><label class="f" for="n2">Répète-le</label>
      <input type="password" id="n2" autocomplete="new-password"></div>
    <button class="btn" id="ngo">Choisir et entrer</button>
    <p class="msg" id="msg"></p>
    <p class="note">Six caractères au minimum. Personne ne pourra le relire ensuite :
    SAM n'en garde qu'une empreinte. Si tu l'oublies, le patron t'en remettra un autre.</p>`;
  const dis=(t,c)=>{ $('msg').textContent=t; $('msg').className='msg '+(c||'err'); };
  const val=async()=>{
    const a=$('n1').value, b=$('n2').value;
    if(a.length<6) return dis('Six caractères au minimum.');
    if(a!==b) return dis('Les deux ne sont pas identiques.');
    if(a===ancien) return dis("Choisis-en un autre que celui qu'on t'a donné.");
    try{
      await changeMonMotDePasse(u.ident,ancien,a);
      const v=await verifie(u.ident,a);
      if(!v||v.bloque) return dis('Impossible de rouvrir la session. Réessaie.');
      ouvreSession(v); journalConnexion(v,'mot de passe choisi, première connexion');
      dis('C\'est enregistré. Bienvenue.','ok');
      setTimeout(()=>location.href=urlDepart(v.role),420);
    }catch(e){ dis((e&&e.message)||'Impossible.'); }
  };
  $('ngo').onclick=val;
  ['n1','n2'].forEach(k=>$(k).addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); val(); } }));
  setTimeout(()=>$('n1').focus(),80);
}

function journalConnexion(u,lib){
  try{

    J.push({t:new Date().toISOString(),u:u.nom,act:'acces',lib,
            ref:u.ident,av:null,ap:(ROLES[u.role]||{}).lib||u.role});
    ecrit('crm-journal-v1',J);
  }catch(e){}
}

/* ---------- comptes de démonstration ----------
   Pour essayer SAM tout de suite, et pour montrer les rôles à quelqu'un.
   Ils portent un mot de passe connu : à supprimer avant la vraie mise en service. */
const DEMO=[

async function poseDemo(){

     passe est écrit à l'écran juste en dessous. Leur demander d'en choisir un

  for(const d of DEMO){ try{ await creeCompte({...d, par:'démonstration', provisoire:false}); }catch(e){} }
  try{ localStorage.setItem(K_DEMO,'1'); }catch(e){}
}
const estDemo=()=>{ try{ return localStorage.getItem(K_DEMO)==='1'; }catch(e){ return false; } };
/* '1' = démonstration en cours, '0' = terminée (on ne remet jamais les comptes),
   absent = SAM n'a encore jamais démarré sur ce poste. */
const demoJamais=()=>{ try{ return localStorage.getItem(K_DEMO)===null; }catch(e){ return false; } };

function blocDemo(){
  if(!estDemo()) return '';
  return `<div class="demo">
    <span class="lab">Comptes d\'essai</span>

      const r=ROLES[d.role]||{};

    }).join('')}</div>

function brancheDemo(){
