server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    autoindex off;

    auth_basic "Perfumes Trade";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # la page d'entrée : ouvrir.html envoie sur l'accueil avec une adresse neuve
    location = / { return 302 /ouvrir.html; }

    # les pages changent à chaque livraison : jamais gardées en mémoire
    location ~* \.(html|js|css)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
        try_files $uri =404;
    }
    # les moteurs de lecture (pdf.js, tesseract : ~20 Mo) ne changent pas : gardés
    # un mois, et le .mjs est déclaré comme du JavaScript, sinon le navigateur
    # refuse de charger le module
    location ^~ /lib/ {
        types { application/javascript js mjs; application/gzip gz; }
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }
    # les photos ne changent pas : gardées un mois
    location /photos/ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }
    location / { try_files $uri $uri/ =404; }

    # rien de ce qui commence par un point ou un tiret bas ne sort
    location ~ /\. { deny all; }
    location ~ /_[^/]*\.html$ { deny all; }
    location /outils/ { deny all; }
}
